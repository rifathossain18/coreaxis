name: coreaxis
description: "CoreAxis - Offline Gate, Visitor & Duty Roster Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.1

  # Local database (all data stored on-device, fully offline)
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3

  # Preferences (first-launch flag, theme mode)
  shared_preferences: ^2.2.2

  # Dates / formatting
  intl: ^0.19.0

  # Calendar view widget (month grid used by the Calendar tab)
  table_calendar: ^3.0.9

  # Export (Reports page)
  pdf: ^3.10.7
  printing: ^5.11.1
  excel: ^4.0.2
  share_plus: ^10.1.4

  # Unique ids for templates / rows where useful
  uuid: ^4.2.2

  # Tap-a-number-to-call feature on the Phone Directory page
  url_launcher: ^6.2.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/




flutter_launcher_icons:
  android: true
  image_path: "assets/coreaxis.png"
  min_sdk_android: 21